<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>making a card using HTML and CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <article class="card">
            <img class="card__image" src="image.png" alt="Lake and mountains">

            <div class="card__tags">
                <span class="tag">Nature</span>
                <span class="tag">Lake</span>
            </div>

            <h1 class="card__title">Lago di Braies</h1>

            <p class="card__text">
                Lorem ipsum dolor sit amet, consectetur adipisicing elit. Consectetur sodales morbi dignissim sed diam
                pharetra vitae ipsum odio.
            </p>

            <a class="card__button" href="#">Read More</a>
        </article>
    </main>
</body>

</html>
